<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Sign in - Events</title>
  <th:block th:replace="~{fragments/layout :: head-assets}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container" style="display:flex;justify-content:center">
  <div style="width:100%;max-width:420px">
    <h1 class="page-title" style="text-align:center">Sign in</h1>
    <p class="lede" style="text-align:center">An event booking &amp; ticketing app built entirely on Mudbase - no custom backend at all.</p>

    <p th:if="${errorMessage}" class="alert alert-notice" th:text="${errorMessage}">Notice</p>
    <p th:if="${authError}" class="alert alert-error" th:text="${authError}">Error</p>

    <form method="post" th:action="@{/login(redirect=${redirectTo})}" th:object="${loginRequest}" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" th:field="*{email}" autocomplete="email" />
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" th:field="*{password}" autocomplete="current-password" />
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
      </div>
      <button type="submit" class="btn btn-accent btn-block">Sign in</button>
    </form>

    <div class="quick-signin">
      <p class="hint-label" style="text-align:center;margin-top:24px">Quick sign-in for this demo</p>
      <div class="quick-signin-row">
        <form method="post" th:action="@{/login(redirect=${redirectTo})}">
          <input type="hidden" name="email" value="events.organizer.demo@gmail.com" />
          <input type="hidden" name="password" value="DemoTest123!" />
          <button type="submit" class="btn btn-outline btn-sm btn-block">Sign in as Organizer</button>
        </form>
        <form method="post" th:action="@{/login(redirect=${redirectTo})}">
          <input type="hidden" name="email" value="events.attendee.demo@gmail.com" />
          <input type="hidden" name="password" value="DemoTest123!" />
          <button type="submit" class="btn btn-outline btn-sm btn-block">Sign in as Attendee</button>
        </form>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
