spring.application.name=mudbase-showcase-events-java
server.port=${PORT:8080}

# --- Mudbase project wiring ---------------------------------------------------
mudbase.base-url=${MUDBASE_URL:https://cloud.mudbase.dev}
mudbase.project-id=${MUDBASE_PROJECT_ID:}
mudbase.events-collection-id=${MUDBASE_EVENTS_COLLECTION_ID:}
mudbase.bookings-collection-id=${MUDBASE_BOOKINGS_COLLECTION_ID:}
mudbase.activity-collection-id=${MUDBASE_ACTIVITY_COLLECTION_ID:}

# --- Thymeleaf ------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Sessions ---------------------------------------------------------------
server.servlet.session.timeout=30m

logging.level.dev.mudbase.showcase.events=INFO
